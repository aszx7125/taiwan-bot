name: 🍏 雲端編譯 iOS App (無簽名版)

on:
  workflow_dispatch: # 允許我們在 GitHub 網頁上手動點擊按鈕觸發

jobs:
  build-ios:
    runs-on: macos-latest # 借用 GitHub 的免費 Mac 電腦！

    steps:
      - name: 📥 抓取程式碼
        uses: actions/checkout@v3

      - name: 🐦 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: 📦 安裝套件
        run: |
          cd app
          flutter pub get

      - name: 🔨 編譯 iOS 原生檔案 (略過簽名)
        run: |
          cd app
          flutter build ios --release --no-codesign

      - name: 🎁 打包成 .ipa 安裝檔
        run: |
          cd app/build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r TaiwanQuantApp.ipa Payload

      - name: 📤 上傳成果供下載
        uses: actions/upload-artifact@v3
        with:
          name: TaiwanQuantApp-iOS
          path: app/build/ios/iphoneos/TaiwanQuantApp.ipa
