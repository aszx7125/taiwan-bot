name: 🛠️ 手動觸發 - 歷史記憶大回補 (全市場 2 年)

on:
  workflow_dispatch: # 這個指令代表「只允許手動點擊按鈕觸發」，不會每天自己亂跑

jobs:
  inject-history:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得最新程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install supabase pandas yfinance numpy

    - name: ⏳ 執行歷史資料大回補 (約需 5~10 分鐘)
      run: python historical_injector.py
      env:
        # 自動抓取您之前設定在 GitHub 的金鑰
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}