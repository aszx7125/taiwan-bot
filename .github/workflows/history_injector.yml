name: 台股量化戰情室 - 歷史數據大回補

on:
  # 🚀 workflow_dispatch 代表『完全手動觸發』，會在 GitHub 網頁上補一顆按鈕給您點
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inject-history:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得最新程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⏳ 啟動時光機：批量解算兩年特徵並注入 Supabase
      run: |
        python historical_injector.py
      env:
        # 🔑 從您之前設定好的 GitHub Secrets 保險箱直接抓取密碼
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}