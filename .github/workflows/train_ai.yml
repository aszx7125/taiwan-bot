name: 台股量化戰情室 - 🧠 AI 大腦雲端訓練所

on:
  workflow_dispatch: # 允許您在 GitHub 網頁上手動按按鈕觸發訓練
  schedule:
    - cron: '0 18 * * 6' # 每週六晚上 6:00 (台灣時間週日凌晨 2:00) 自動重新訓練

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得最新程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝機器學習與量化套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # 雙重保險，確保機器學習套件有安裝
        pip install scikit-learn joblib

    - name: 🧠 啟動機器學習深度訓練 (連線 Supabase)
      run: python train_tools/ai_trainer.py
      env:
        PYTHONPATH: .
        # 🔑 從 GitHub Secrets 自動抓取金鑰
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    - name: Commit and Push Updated Models
      run: |
          git config --local user.email "bot@quant.factory"
          git config --local user.name "AI-Trainer-Bot"
          
          # 將有變動的檔案加入暫存區
          git add quant_model.joblib model_features.joblib lstm_momentum_brain.h5 model_metrics.json
          
          # 提交變更 (如果沒有變動則略過)
          git commit -m "🤖 自動更新：雙核深度大腦與真實勝率報告 [Skip CI]" || echo "No changes to commit"
          
          # 🔥 關鍵防撞車機制：在推播前，先以 rebase 方式拉取遠端最新程式碼
          git pull --rebase origin main
          
          # 最後再安全地推播上去
          git push
        