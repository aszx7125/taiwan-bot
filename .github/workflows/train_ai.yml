name: 台股量化 - 🧠 四核大腦訓練 (多空雙向)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 6'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  train-quad-core:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # 🔥 強制蓋掉 requirements 裡的設定，使用在 GitHub 環境中最穩定的 2.13 版本
        pip install tensorflow-cpu==2.13.0
        pip install scikit-learn joblib supabase

    # ── 多頭模型訓練 ─────────────────────────────────
    - name: 🌳 訓練多頭 LightGBM
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python train_tools/ai_trainer.py

    - name: 🔮 訓練多頭 LSTM
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python train_lstm.py

    # ── 空頭模型訓練 ─────────────────────────────────
    - name: 🌳 訓練空頭 LightGBM
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python ai_trainer_short.py

    - name: 🔮 訓練空頭 LSTM 
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python train_lstm_short.py

    # ── 驗證 ─────────────────────────────────────────
    - name: 📊 驗證四核心
      run: |
        echo "檢查模型檔案..."
        ls -lh *.joblib *.h5
        echo ""
        echo "多頭模型："
        python -c "import joblib; m=joblib.load('quant_model.joblib'); print(f'  特徵數: {m.n_features_}')"
        echo ""
        echo "空頭模型："
        python -c "import joblib; m=joblib.load('quant_model_short.joblib'); print(f'  特徵數: {m.n_features_}')"

    # ── 提交 ─────────────────────────────────────────
    - name: 📤 提交四核心模型
      run: |
        git config --local user.email "bot@quant.factory"
        git config --local user.name "QuadCore-Trainer"
        
        git add quant_model.joblib quant_model_short.joblib \
                model_features.joblib model_features_short.joblib \
                lstm_momentum_brain.h5 lstm_short_brain.h5 \
                lstm_scaler.joblib lstm_scaler_short.joblib \
                model_metrics.json
        
        if git diff --quiet && git diff --cached --quiet; then
          echo "無變更"
        else
          git commit -m "🤖 四核大腦更新：多空雙向模型 [Skip CI]"
          git pull --rebase origin main
          git push origin main
        fi