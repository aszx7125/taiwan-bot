name: 台股量化戰情室 - 每日背景引擎

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得最新程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 執行全市場多時區深度運算
      run: |
        python backend_updater.py
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

   # 🚀 終極修復：使用 Fetch + Reset 策略，徹底繞過 JSON 的合併衝突
    - name: 💾 將運算結果 (JSON) 寫回儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Quant Bot"
        
        if [ -f market_snapshot.json ]; then
          # 1. 抓取遠端最新進度 (包含您可能剛剛 Push 的任何程式碼)
          git fetch origin main
          
          # 2. 將本地時間線對齊遠端最新，但『保留』我們剛剛算好的最新 JSON 檔案
          git reset origin/main
          
          # 3. 重新將覆蓋好的 JSON 加入提交序列
          git add market_snapshot.json
          
          if [ -n "$(git status --porcelain market_snapshot.json)" ]; then
            git commit -m "🤖 自動更新全市場量化快取 [skip ci]"
            # 4. 毫無衝突地將結果推播上去
            git push origin main
            echo "✅ 資料已成功推送到倉庫！"
          else
            echo "✅ JSON 檔案無變更，無需 Commit。"
          fi
        else
          echo "⚠️ 警告：market_snapshot.json 未生成。"
        fi