name: 台股量化戰情室 - 每日背景引擎

# 設定觸發時間 (Cron Job)
on:
  schedule:
    # 這裡設定為 UTC 時間 06:30 (台灣時間下午 14:30，台股剛收盤且資料已結算)
    # 僅在週一到週五執行
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊執行

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得最新程式碼
      uses: actions/checkout@v3

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 執行全市場多時區深度運算
      run: |
        python backend_updater.py

    - name: 💾 將運算結果 (JSON) 寫回儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Quant Bot"
        git add market_snapshot.json
        # 如果檔案有更新才 commit
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新全市場量化快取 [skip ci]" && git push)