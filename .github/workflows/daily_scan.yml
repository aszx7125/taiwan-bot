name: 台股量化戰情室 - 每日背景引擎

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

# 🚀 修復 1：強制使用 Node.js 24，消滅系統廢棄警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 取得最新程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 安裝量化套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 執行全市場多時區深度運算
      run: |
        python backend_updater.py

    - name: 💾 將運算結果 (JSON) 寫回儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Quant Bot"
        git add market_snapshot.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新全市場量化快取 [skip ci]" && git push)